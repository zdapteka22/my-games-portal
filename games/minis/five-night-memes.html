<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Five Night Memes</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;color:#ddd;font-family:Segoe UI,sans-serif;overflow:hidden}
  a.back{position:fixed;left:10px;top:10px;z-index:20;background:#fc0;color:#111;padding:8px 14px;border-radius:10px;font-weight:800;text-decoration:none;font-size:14px}
  #app{position:absolute;inset:0;display:flex;flex-direction:column}
  #view{flex:1;position:relative;overflow:hidden;background:#0a0806}
  #office{
    position:absolute;inset:0;
    background:
      linear-gradient(90deg,#0a0a0a 0%,#0a0a0a 8%,transparent 18%,transparent 82%,#0a0a0a 92%,#0a0a0a 100%),
      radial-gradient(ellipse 80% 60% at 50% 55%,#3a2e1a 0%,#1a140c 45%,#080604 100%);
  }
  #office::before{
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(90deg,transparent,transparent 48px,rgba(0,0,0,.08) 48px,rgba(0,0,0,.08) 49px);
    pointer-events:none;
  }
  .hall{position:absolute;top:18%;bottom:32%;width:22%;background:linear-gradient(180deg,#1a1410,#0c0a08);border:3px solid #2a2018}
  .hall.L{left:0;border-left:0;transform:perspective(400px) rotateY(18deg);transform-origin:left}
  .hall.R{right:0;border-right:0;transform:perspective(400px) rotateY(-18deg);transform-origin:right}
  .hall::after{content:"";position:absolute;inset:12%;background:radial-gradient(ellipse at 50% 30%,#2a2218,#0a0806 70%);border:2px solid #1a1410}
  #desk{
    position:absolute;left:0;right:0;bottom:0;height:30%;
    background:linear-gradient(180deg,#2a1e14 0%,#120e0a 100%);
    border-top:6px solid #4a3420;box-shadow:0 -20px 60px rgba(0,0,0,.6);
  }
  #desk::before{
    content:"";position:absolute;left:8%;right:8%;top:18%;height:55%;
    background:linear-gradient(180deg,#1a1612,#0e0c0a);border:2px solid #3a3020;border-radius:4px;
  }
  .fan{position:absolute;left:50%;bottom:32%;transform:translateX(-50%);font-size:42px;filter:drop-shadow(0 0 8px rgba(255,255,255,.2));animation:spin 2s linear infinite}
  @keyframes spin{to{transform:translateX(-50%) rotate(360deg)}}
  .poster{position:absolute;left:50%;top:22%;transform:translateX(-50%);width:90px;height:70px;background:#1a1408;border:3px solid #4a3820;display:grid;place-items:center;font-size:28px;opacity:.85}
  .doorBtn{
    position:absolute;top:22%;bottom:34%;width:56px;z-index:5;
    background:linear-gradient(180deg,#2a2a2a,#111);border:3px solid #555;
    color:#fc0;font-weight:900;font-size:11px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2;
    box-shadow:inset 0 0 20px rgba(0,0,0,.5);
  }
  .doorBtn.L{left:2%}.doorBtn.R{right:2%}
  .doorBtn.on{background:linear-gradient(180deg,#5a1010,#2a0000);border-color:#f44;box-shadow:0 0 24px rgba(255,60,0,.5),inset 0 0 20px rgba(0,0,0,.5);color:#faa}
  .doorBtn span{display:block;font-size:22px;margin-bottom:4px}
  #camBox{
    position:absolute;inset:8% 10% 32%;background:#050505;border:6px solid #1a1a1a;
    display:none;align-items:center;justify-content:center;flex-direction:column;z-index:4;
    box-shadow:0 0 40px rgba(0,0,0,.8),inset 0 0 80px rgba(0,0,0,.6);
  }
  #camBox.on{display:flex}
  #static{position:absolute;inset:0;opacity:.18;pointer-events:none;background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 4px);animation:static .15s steps(2) infinite}
  @keyframes static{50%{opacity:.08}}
  #camFace{font-size:min(22vw,120px);filter:drop-shadow(0 0 20px rgba(255,0,0,.3))}
  #camName{margin-top:12px;color:#6f6;font-weight:800;letter-spacing:2px;font-size:14px;text-transform:uppercase}
  #camHint{color:#666;font-size:12px;margin-top:6px}
  #panel{position:absolute;right:8px;top:52px;display:grid;gap:5px;z-index:6}
  #panel button{background:#0a140a;color:#7f7;border:1px solid #363;padding:7px 10px;font-weight:800;cursor:pointer;font-size:11px;text-align:left;min-width:110px}
  #panel button.on{background:#1a301a;border-color:#6c6;color:#cfc}
  #tog{
    position:absolute;left:50%;bottom:10%;transform:translateX(-50%);z-index:6;
    background:linear-gradient(180deg,#3a3000,#1a1800);color:#fc0;border:2px solid #a80;
    padding:12px 28px;font-weight:900;font-size:15px;cursor:pointer;border-radius:8px;
    box-shadow:0 4px 0 #5a4000;
  }
  #tog:active{transform:translateX(-50%) translateY(2px);box-shadow:0 2px 0 #5a4000}
  #hud{position:absolute;left:12px;bottom:10px;font-weight:800;font-size:15px;text-shadow:0 2px 4px #000;z-index:6}
  #hud b{color:#fc0}
  #vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.65) 100%);z-index:3}
  #end{display:none;position:absolute;inset:0;background:#000;z-index:30;align-items:center;justify-content:center;flex-direction:column;font-size:clamp(1.4rem,5vw,2.4rem);text-align:center}
  #scare{font-size:min(30vw,140px);animation:shake .08s infinite}
  @keyframes shake{25%{transform:translate(4px,-2px)}75%{transform:translate(-4px,2px)}}
  #tip{position:fixed;right:10px;top:10px;z-index:20;background:rgba(0,0,0,.7);border:1px solid #444;color:#aaa;font-size:11px;padding:6px 10px;border-radius:8px;max-width:180px;line-height:1.3}
</style>
</head>
<body>
<a class="back" href="../../play.html?id=five-night-memes">&#8592; Портал</a>
<div id="tip">Мини-версия в браузере. Полная — APK на сайте.</div>
<div id="app">
  <div id="view">
    <div id="office">
      <div class="hall L"></div>
      <div class="hall R"></div>
      <div class="poster">&#x1F3AD;</div>
      <div class="fan">&#x1F32C;</div>
      <button class="doorBtn L" id="L"><span>&#x1F6AA;</span>ЛЕВ<br>дверь</button>
      <button class="doorBtn R" id="R"><span>&#x1F6AA;</span>ПРАВ<br>дверь</button>
      <div id="camBox">
        <div id="static"></div>
        <div id="camFace">&#x00b7;&#x00b7;&#x00b7;</div>
        <div id="camName">CAM 1</div>
        <div id="camHint">Следи за мемами — закрывай двери!</div>
      </div>
      <div id="vignette"></div>
      <div id="desk"></div>
    </div>
    <div id="panel">
      <button data-c="0" class="on">CAM 1 Сцена</button>
      <button data-c="1">CAM 2 Коридор</button>
      <button data-c="2">CAM 3 Кухня</button>
      <button data-c="3">CAM 4 Пират</button>
    </div>
    <button id="tog">&#x1F4F7; КАМЕРЫ</button>
    <div id="hud"><b id="clock">12 AM</b> &middot; &#x26A1; <span id="pow">100</span>%</div>
  </div>
</div>
<div id="end"><div id="scare"></div><div id="endT"></div></div>
<script src="../mods-data.js"></script>
<script>
window.PORTAL_GAME_ID="five-night-memes";
const hard=window.portalModOn&&(portalModOn("fn-night6","five-night-memes")||portalModOn("all-mode-hard","five-night-memes"));
const save=window.portalModOn&&portalModOn("fn-cam","five-night-memes");
const names=["Нинин \u{1F921}","Миньон \u{1F49B}","Губка \u{1F9FD}","Соник \u{1F4A8}"];
const face=["\u{1F921}","\u{1F49B}","\u{1F9FD}","\u{1F4A8}"];
let cam=0,camsOn=false,L=false,R=false,pow=100,hour=0,t=0,dead=false;
const pos=[0,0,0,0];
const rooms=["Сцена","Коридор Л","Кухня","Пиратский залив"];
document.getElementById("L").onclick=()=>{L=!L;document.getElementById("L").classList.toggle("on",L)};
document.getElementById("R").onclick=()=>{R=!R;document.getElementById("R").classList.toggle("on",R)};
document.getElementById("tog").onclick=()=>{camsOn=!camsOn;document.getElementById("camBox").classList.toggle("on",camsOn)};
document.querySelectorAll("#panel button").forEach(b=>{
  b.onclick=()=>{cam=+b.dataset.c;document.querySelectorAll("#panel button").forEach(x=>x.classList.toggle("on",+x.dataset.c===cam));draw()};
});
function draw(){
  const here=pos.map((p,i)=>p===cam?face[i]:"").filter(Boolean);
  document.getElementById("camFace").textContent=here[0]||"\u00b7\u00b7\u00b7";
  document.getElementById("camName").textContent="CAM "+(cam+1)+" \u2014 "+rooms[cam]+(here[0]?" \u00b7 \u26A0 ДВИЖЕНИЕ":"");
}
function lose(i){
  dead=true;
  document.getElementById("end").style.display="flex";
  document.getElementById("scare").textContent=i<0?"\u{1F4A1}":face[i];
  document.getElementById("endT").textContent=i<0?"Энергия 0%!":("СКРИМЕР \u2014 "+names[i]);
}
function tick(){
  if(dead) return;
  t++;
  if(t%50===0) pow-=(L?0.8:0)+(R?0.8:0)+(camsOn?(save?0.15:0.45):0.05)+0.08;
  if(t%400===0) hour++;
  if(t%(hard?70:110)===0) pos.forEach((p,i)=>{if(Math.random()<(hard?0.62:0.34+i*0.05))pos[i]=Math.min(5,pos[i]+1)});
  if(pos[0]>=5&&!L) return lose(0);
  if(pos[1]>=5&&!L) return lose(1);
  if(pos[2]>=5&&!R) return lose(2);
  if(pos[3]>=5&&!R) return lose(3);
  if(pow<=0) return lose(-1);
  if(hour>=6){dead=true;document.getElementById("end").style.display="flex";document.getElementById("scare").textContent="\u2600\uFE0F";document.getElementById("endT").textContent="6 AM \u2014 ты выжил!";return;}
  document.getElementById("clock").textContent=(hour===0?"12":hour)+" AM";
  document.getElementById("pow").textContent=Math.max(0,pow|0);
  draw();
}
setInterval(tick,70);
draw();
</script>
</body>
</html>
