<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Meme Neighbor</title>
<style>
  html,body{margin:0;height:100%;background:#0c0a09;color:#eee;font-family:Segoe UI,sans-serif;overflow:hidden}
  #cv{display:block;width:100%;height:100%}
  #hud{position:fixed;left:12px;top:10px;z-index:3;text-shadow:0 2px 0 #000;pointer-events:none}
  #hud b{color:#ffcc00}
  #inv{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:3}
  #inv span{width:48px;height:48px;border:2px solid #664;background:#1a1410;display:grid;place-items:center;font-size:22px;border-radius:8px}
  a.back{position:fixed;right:10px;top:10px;z-index:4;background:#ffcc00;color:#111;padding:8px 12px;border-radius:10px;font-weight:800;text-decoration:none}
  #flash{position:fixed;inset:0;pointer-events:none;z-index:5}
</style>
</head>
<body>
<a class="back" href="../../index.html#classics">← Портал</a>
<div id="hud"><b>MEME NEIGHBOR</b><br><span id="st">Собери ключ, молоток и батарейку. Выйди в дверь.</span></div>
<div id="inv"><span id="i0">·</span><span id="i1">·</span><span id="i2">·</span></div>
<div id="flash"></div>
<canvas id="cv"></canvas>
<script src="../mods-data.js"></script>
<script>
const C=document.getElementById("cv"),X=C.getContext("2d");
let W,H; function fit(){W=C.width=innerWidth;H=C.height=innerHeight} fit(); addEventListener("resize",fit);
const hard=window.portalModOn&&(portalModOn("mn-sprint")||portalModOn("all-mode-hard"));
const mask=window.portalModOn&&portalModOn("mn-mask");
const sonic=window.portalModOn&&portalModOn("all-char-sonic");
const K={}; addEventListener("keydown",e=>K[e.code]=true); addEventListener("keyup",e=>K[e.code]=false);

const TILE=48;
const MAP=[
"####################",
"#........#....K....#",
"#..####..#..####...#",
"#..#.........#.....#",
"#..#..##.##..#..B..#",
"#.....#...#........#",
"####..#...#..#######",
"#P....#...#........#",
"#.....#...####..#..#",
"#..H............#..#",
"#.....######....#..#",
"#..M..#....#.......#",
"#.....#.N..#...E...#",
"####################"
];
const Hm=MAP.length, Wm=MAP[0].length;
const walls=new Set();
let px=2,py=7, items={K:false,M:false,B:false};
const loot=[];
let nx=10,ny=12, nPath=1, nAlert=0, caught=false, won=false, tick=0;
for(let y=0;y<Hm;y++) for(let x=0;x<Wm;x++){
  const c=MAP[y][x];
  if(c==="#") walls.add(x+","+y);
  if(c==="P"){px=x+.5;py=y+.5}
  if(c==="N"){nx=x+.5;ny=y+.5}
  if(c==="K") loot.push({x:x+.5,y:y+.5,id:"K",g:"🔑"});
  if(c==="M") loot.push({x:x+.5,y:y+.5,id:"M",g:"🔨"});
  if(c==="B") loot.push({x:x+.5,y:y+.5,id:"B",g:"🔋"});
}

function blocked(x,y){return walls.has((x|0)+","+(y|0))}
function canSee(){
  const dx=px-nx, dy=py-ny, d=Math.hypot(dx,dy);
  if(d>(mask?5.2:8.5)) return false;
  const s=Math.ceil(d*4);
  for(let i=1;i<s;i++){ if(blocked(nx+dx*i/s, ny+dy*i/s)) return false; }
  return true;
}

function loop(){
  requestAnimationFrame(loop);
  tick++;
  if(!caught&&!won){
    let vx=0,vy=0, sp=sonic?0.09:0.065;
    if(K.KeyA||K.ArrowLeft)vx-=1; if(K.KeyD||K.ArrowRight)vx+=1;
    if(K.KeyW||K.ArrowUp)vy-=1; if(K.KeyS||K.ArrowDown)vy+=1;
    const l=Math.hypot(vx,vy)||1; vx=vx/l*sp; vy=vy/l*sp;
    if(!blocked(px+vx,py)) px+=vx;
    if(!blocked(px,py+vy)) py+=vy;
    loot.forEach(it=>{ if(!items[it.id] && Math.hypot(px-it.x,py-it.y)<.45) items[it.id]=true; });
    if(items.K&&items.M&&items.B && px>16 && py>11) won=true;
    const nsp=(hard?0.055:0.032)+(nAlert>0?0.04:0);
    if(canSee()){ nAlert=90; const a=Math.atan2(py-ny,px-nx); nx+=Math.cos(a)*nsp; ny+=Math.sin(a)*nsp; }
    else {
      nAlert=Math.max(0,nAlert-1);
      nx+=nPath*nsp; if(blocked(nx+.3,ny)||blocked(nx-.3,ny)||nx<2||nx>18) nPath*=-1;
    }
    if(Math.hypot(px-nx,py-ny)<.55) caught=true;
  }
  if((caught||won)&&K.KeyR){ location.reload(); }

  const camx=px*TILE-W/2, camy=py*TILE-H/2;
  X.fillStyle="#1a100c"; X.fillRect(0,0,W,H);
  for(let y=0;y<Hm;y++) for(let x=0;x<Wm;x++){
    const sx=x*TILE-camx, sy=y*TILE-camy;
    const c=MAP[y][x];
    if(c==="#"){ X.fillStyle="#3a2a22"; X.fillRect(sx,sy,TILE,TILE); X.fillStyle="#2a1c16"; X.fillRect(sx+4,sy+4,TILE-8,TILE-8); }
    else { X.fillStyle=(x+y)%2?"#2c2118":"#261c14"; X.fillRect(sx,sy,TILE,TILE); }
    if(c==="E"){ X.fillStyle="#4a3020"; X.fillRect(sx+8,sy+4,TILE-16,TILE-8); X.fillStyle="#c9a227"; X.fillText("🚪",sx+12,sy+32); }
    if(c==="H"){ X.fillStyle="#5a4030"; X.fillRect(sx+10,sy+18,28,22); }
  }
  loot.forEach(it=>{ if(!items[it.id]){ X.font="28px sans-serif"; X.fillText(it.g, it.x*TILE-camx-12, it.y*TILE-camy+10); } });
  X.font="34px sans-serif";
  X.fillText(sonic?"💨":"🧒", px*TILE-camx-16, py*TILE-camy+12);
  X.fillText(nAlert?"🤬":"😡", nx*TILE-camx-16, ny*TILE-camy+12);
  if(canSee()){ X.fillStyle="rgba(255,40,0,.12)"; X.beginPath(); X.arc(nx*TILE-camx,ny*TILE-camy, 140,0,7); X.fill(); }

  document.getElementById("i0").textContent=items.K?"🔑":"·";
  document.getElementById("i1").textContent=items.M?"🔨":"·";
  document.getElementById("i2").textContent=items.B?"🔋":"·";
  const st=document.getElementById("st");
  if(caught) st.textContent="ПОЙМАЛИ! R — заново";
  else if(won) st.textContent="СБЕЖАЛ ИЗ ДОМА!";
  else st.textContent=canSee()?"ОН ТЕБЯ ВИДИТ!":"Собери ключ, молоток, батарейку → дверь 🚪";
}
loop();
</script>
</body>
</html>
