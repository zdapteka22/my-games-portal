<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Моды — Портал любимых игр · Blue Cat</title>
  <link rel="icon" href="images/blue-cat.svg" type="image/svg+xml">
  <style>
    :root { --bg:#0a0a0a; --card:#1c1c1c; --y:#ffcc00; --t:#fff; --m:#aaa; --b:#333; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:"Segoe UI",sans-serif; background:var(--bg); color:var(--t); min-height:100vh; }
    header { display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--b); background:#111; position:sticky; top:0; z-index:5; }
    header a { color:#111; background:var(--y); padding:8px 14px; border-radius:999px; font-weight:800; text-decoration:none; }
    h1 { font-size:1.25rem; }
    .wrap { max-width:1100px; margin:0 auto; padding:18px 14px 48px; }
    .sub { color:var(--m); margin:8px 0 16px; }
    .filters, .games { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
    .filters button, .games button {
      border:1px solid var(--b); background:#151515; color:#ddd; padding:8px 14px; border-radius:999px; font-weight:800; cursor:pointer;
    }
    .filters button.on, .games button.on { background:var(--y); color:#111; border-color:var(--y); }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; }
    .card { background:var(--card); border:1px solid var(--b); border-radius:16px; padding:14px; }
    .card h3 { font-size:1.05rem; margin:6px 0; }
    .card p { color:var(--m); font-size:.92rem; min-height:2.6em; }
    .tag { display:inline-block; font-size:11px; font-weight:800; background:#2a2a2a; padding:3px 8px; border-radius:999px; margin-right:4px; color:#ffdd77; }
    .onoff { margin-top:10px; width:100%; min-height:40px; border:0; border-radius:12px; font-weight:800; cursor:pointer; }
    .onoff.off { background:#2a2a2a; color:#ccc; }
    .onoff.on { background:linear-gradient(135deg,#ffcc00,#ff9f1c); color:#2a1200; }
    .play-link { display:inline-block; margin-top:4px; color:var(--y); font-weight:800; text-decoration:none; }
    .empty { color:var(--m); padding:24px 4px; }
  </style>
</head>
<body>
  <header>
    <a href="index.html">← Портал</a>
    <h1>🧩 Моды</h1>
  </header>
  <div class="wrap">
    <p class="sub">Сначала выбери игру. Включение мода только для неё — в другие игры он не попадёт. Кнопка «Включить» не запускает игру.</p>
    <div class="games" id="games"></div>
    <p id="gameHint" class="sub"></p>
    <div class="filters" id="filters">
      <button data-c="all" class="on">Все</button>
      <button data-c="knife">🔪 Нож</button>
      <button data-c="character">👤 Персонажи</button>
      <button data-c="mode">🎮 Режим</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  <script src="games/mods-data.js"></script>
  <script>
    const names={knife:"Нож",character:"Персонаж",mode:"Режим"};
    let cat="all";
    let gameId="";
    try { gameId = new URLSearchParams(location.search).get("id") || ""; } catch(e) {}

    const gamesBox=document.getElementById("games");
    gamesBox.innerHTML=(PORTAL_MOD_GAMES||[]).map(g=>
      `<button type="button" data-id="${g.id}" class="${g.id===gameId?"on":""}">${g.title}</button>`
    ).join("");

    function draw(){
      const hint=document.getElementById("gameHint");
      const box=document.getElementById("grid");
      if(!gameId){
        hint.textContent="Выбери игру сверху — моды включаются только в ней.";
        box.innerHTML="";
        return;
      }
      const title=(PORTAL_MOD_GAMES.find(g=>g.id===gameId)||{}).title||gameId;
      hint.innerHTML="Моды для <b>"+title+"</b>. <a class='play-link' href='play.html?id="+encodeURIComponent(gameId)+"#mods'>Открыть вкладку Моды в игре →</a>";
      const list=portalModsForGame(gameId).filter(m=>cat==="all"||m.cat===cat);
      if(!list.length){
        box.innerHTML="<p class='empty'>Для этой игры в этом разделе модов нет.</p>";
        return;
      }
      box.innerHTML=list.map(m=>{
        const on=portalModOn(m.id, gameId);
        return `<article class="card">
          <span class="tag">${names[m.cat]||m.cat}</span>
          <h3>${m.emoji} ${m.title}</h3>
          <p>${m.desc}</p>
          <button type="button" class="onoff ${on?"on":"off"}" data-id="${m.id}">${on?"✓ Включён в этой игре":"Включить только здесь"}</button>
        </article>`;
      }).join("");
    }

    gamesBox.onclick=e=>{
      const b=e.target.closest("button[data-id]"); if(!b) return;
      gameId=b.dataset.id;
      [...gamesBox.children].forEach(x=>x.classList.toggle("on",x===b));
      const u=new URL(location.href);
      u.searchParams.set("id", gameId);
      history.replaceState(null,"",u);
      draw();
    };
    document.getElementById("filters").onclick=e=>{
      const b=e.target.closest("button"); if(!b) return;
      cat=b.dataset.c; [...document.getElementById("filters").children].forEach(x=>x.classList.toggle("on",x===b));
      draw();
    };
    document.getElementById("grid").onclick=e=>{
      const b=e.target.closest("button.onoff"); if(!b||!gameId) return;
      portalModSet(b.dataset.id, !portalModOn(b.dataset.id, gameId), gameId);
      draw();
    };
    draw();
  </script>
</body>
</html>
